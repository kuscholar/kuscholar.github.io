# Site Settings
title: "Kusch Qin | Software Engineer"
email: kuschqin@gmail.com
description: >-
  Software Engineer specializing in iOS development for smart home security applications. 
  Building features that enhance home protection and user experience for millions of 
  American households through innovative mobile solutions.

baseurl: ""
url: "https://kuscholar.github.io"

# Professional Profile
author:
  name: "Kusch Qin"
  title: "Software Engineer II"
  company: "Wyze"
  specialization: "iOS Development & Smart Home Security"
  location: "United States"

# Social & Professional Links
github_username: kuscholar
linkedin_username: kusch-qin
google_scholar_id: qBpKisAAAAAJ

# Build Settings
theme: minima
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Navigation
header_pages:
  - about.markdown
  - projects.markdown
  - publications.markdown
  - contact.markdown

# Collections for structured content
collections:
  projects:
    output: true
    permalink: /projects/:path/
  publications:
    output: true
    permalink: /publications/:path/

# SEO & Meta
twitter:
  card: summary_large_image

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
      type: "publications"
    values:
      layout: publication

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
