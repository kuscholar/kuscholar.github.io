---
layout: default
---

<article class="page project">
  <div class="wrapper">
    <a class="back-link" href="{{ '/' | relative_url }}#work"><span aria-hidden="true">←</span> Back to portfolio</a>
    <div class="page-header">
      <span class="section-kicker">Project</span>
      <h1>{{ page.title | escape }}</h1>
      {%- if page.description -%}
        <p class="page-subtitle">{{ page.description }}</p>
      {%- endif -%}
    </div>
    
    <div class="project-content">
      {{ content }}
    </div>
    
    {%- if page.technologies -%}
    <div class="card-tags project-technologies">
      {%- for tech in page.technologies -%}
        <span class="tag">{{ tech }}</span>
      {%- endfor -%}
    </div>
    {%- endif -%}
    
    <div class="page-actions">
      <a href="{{ '/projects/' | relative_url }}" class="btn btn-secondary">← Back to All Projects</a>
    </div>
  </div>
</article>
